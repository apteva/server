name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: |
          go mod edit -dropreplace=github.com/apteva/app-sdk
          go mod download github.com/apteva/app-sdk
      - run: go test ./... -count=1 -timeout=10m
      - run: go vet ./...
      - run: go test -race ./... -short -count=1 -timeout=30m
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      # Local monorepo builds overlay ../app-sdk, but the standalone server
      # release checkout has no sibling directory. Release against the pinned
      # published SDK from go.mod instead.
      - name: Resolve published app-sdk
        run: |
          go mod edit -dropreplace=github.com/apteva/app-sdk
          go mod download github.com/apteva/app-sdk

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o apteva-server-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apteva-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apteva-server-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apteva-server-*
          generate_release_notes: true
