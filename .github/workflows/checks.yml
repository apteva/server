name: Checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      - name: Checkout integration catalog sources for parity tests
        uses: actions/checkout@v4
        with:
          repository: apteva/integrations
          path: integrations
      - name: Checkout Core for managed MCP startup test
        uses: actions/checkout@v4
        with:
          repository: apteva/core
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Resolve published SDK
        run: |
          go mod edit -dropreplace=github.com/apteva/app-sdk
          go mod download github.com/apteva/app-sdk
      - run: go test ./... -count=1 -timeout=10m
      - run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go build -o /tmp/apteva-server .

  # The root package's tests run sequentially and the race detector slows
  # them ~9x (~45 min on a fast laptop, over 60 min on CI), so they are
  # split round-robin by test name across parallel shards; shard 0 also
  # races every other package.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      - name: Checkout integration catalog sources for parity tests
        uses: actions/checkout@v4
        with:
          repository: apteva/integrations
          path: integrations
      - name: Checkout Core for managed MCP startup test
        uses: actions/checkout@v4
        with:
          repository: apteva/core
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Resolve published SDK
        run: |
          go mod edit -dropreplace=github.com/apteva/app-sdk
          go mod download github.com/apteva/app-sdk
      - name: Race tests (shard ${{ matrix.shard }} of 4)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          tests=$(go test -race -list '^Test' . | grep '^Test' | awk -v n="$SHARDS" -v s="$SHARD" '(NR-1)%n==s' | paste -sd'|' -)
          test -n "$tests"
          go test -race -short -count=1 -timeout=40m -run "^($tests)\$" .
          if [ "$SHARD" = 0 ]; then
            go test -race -short -count=1 -timeout=20m $(go list ./... | grep -vx github.com/apteva/server)
          fi
